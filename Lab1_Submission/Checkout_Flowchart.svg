<rect x="265.0" y="83.0" width="230" height="50" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="105.3" class="t" font-size="11">Shopper opens the cart and selects</text>
<text x="380.0" y="118.3" class="t" font-size="11">&quot;Checkout&quot;</text>
<polygon points="380.0,148.0 485.0,196.0 380.0,244.0 275.0,196.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
