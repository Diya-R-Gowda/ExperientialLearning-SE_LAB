<text x="380.0" y="206.3" class="t" font-size="11">stock?</text>
<rect x="585.0" y="163.0" width="210" height="66" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="690.0" y="186.8" class="t" font-size="11">Show &quot;item unavailable&quot;, drop</text>
<text x="690.0" y="199.8" class="t" font-size="11">the item, return the Shopper to</text>
<text x="690.0" y="212.8" class="t" font-size="11">the cart</text>
<rect x="602.0" y="269.0" width="176" height="46" rx="23" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="690.0" y="289.4" class="t" font-size="11">End - back to cart, no</text>
<text x="690.0" y="302.4" class="t" font-size="11">order created</text>
<rect x="265.0" y="277.0" width="230" height="46" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="297.4" class="t" font-size="11">Reserve stock quantities for this</text>
<text x="380.0" y="310.4" class="t" font-size="11">order</text>
<rect x="255.0" y="342.0" width="250" height="72" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="368.9" class="t" font-size="11">Show order summary grouped by vendor:</text>
<text x="380.0" y="381.9" class="t" font-size="11">item earnings, 5% platform</text>
<text x="380.0" y="394.9" class="t" font-size="11">commission, shipping, total</text>
<rect x="265.0" y="439.0" width="230" height="46" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="459.4" class="t" font-size="11">Shopper confirms the shipping</text>
<text x="380.0" y="472.4" class="t" font-size="11">address</text>
<rect x="265.0" y="507.0" width="230" height="50" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="529.4" class="t" font-size="11">Shopper selects a payment method</text>
<text x="380.0" y="542.4" class="t" font-size="11">and selects &quot;Pay&quot;</text>
<rect x="265.0" y="580.0" width="230" height="52" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="596.9" class="t" font-size="11">System sends the total and the</text>
<text x="380.0" y="609.9" class="t" font-size="11">per-vendor split to the Payment</text>
<text x="380.0" y="622.9" class="t" font-size="11">Gateway</text>
<polygon points="380.0,644.0 485.0,692.0 380.0,740.0 275.0,692.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="380.0" y="695.9" class="t" font-size="11">Payment authorised?</text>
<polygon points="690.0,644.0 785.0,692.0 690.0,740.0 595.0,692.0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="690.0" y="695.9" class="t" font-size="11">Attempts so far &lt; 2 ?</text>
<rect x="590.0" y="529.0" width="200" height="54" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="690.0" y="553.4" class="t" font-size="11">Prompt the Shopper for another</text>
<text x="690.0" y="566.4" class="t" font-size="11">payment method</text>
<rect x="585.0" y="781.0" width="210" height="62" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="690.0" y="802.9" class="t" font-size="11">Cancel checkout, release</text>
<text x="690.0" y="815.9" class="t" font-size="11">reserved stock, keep the cart</text>
<text x="690.0" y="828.9" class="t" font-size="11">intact</text>
<rect x="602.0" y="883.0" width="176" height="50" rx="25" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="690.0" y="905.4" class="t" font-size="11">End - payment failed, no</text>
<text x="690.0" y="918.4" class="t" font-size="11">money held</text>
<rect x="255.0" y="769.0" width="250" height="74" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="790.4" class="t" font-size="11">Gateway captures the total, transfers</text>
<text x="380.0" y="803.4" class="t" font-size="11">each vendor share (earnings minus 5%)</text>
<text x="380.0" y="816.4" class="t" font-size="11">and the 5% commission to the platform</text>
<text x="380.0" y="829.4" class="t" font-size="11">account</text>
<rect x="255.0" y="866.0" width="250" height="72" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="892.9" class="t" font-size="11">Create one order per vendor (status:</text>
<text x="380.0" y="905.9" class="t" font-size="11">Paid - Awaiting Shipment); mark each</text>
<text x="380.0" y="918.9" class="t" font-size="11">payout as Held</text>
<rect x="265.0" y="963.0" width="230" height="50" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="985.4" class="t" font-size="11">Reduce stock by the ordered</text>
<text x="380.0" y="998.4" class="t" font-size="11">quantities and clear the cart</text>
<rect x="265.0" y="1036.0" width="230" height="52" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="1052.8" class="t" font-size="11">Notify each vendor of the new</text>
<text x="380.0" y="1065.8" class="t" font-size="11">order; email the receipt to the</text>
<text x="380.0" y="1078.8" class="t" font-size="11">Shopper</text>
<rect x="265.0" y="1110.0" width="230" height="52" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="1133.3" class="t" font-size="11">Show the confirmation page with</text>
<text x="380.0" y="1146.3" class="t" font-size="11">the per-vendor breakdown</text>
<rect x="305.0" y="1190.0" width="150" height="44" rx="22" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="380.0" y="1215.8" class="t" font-size="11">End - order placed</text>
</svg>